[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dynamic_padding = false

[font]
size = 16
normal.family = "Inconsolata"

# Base24 0x96f theme (https://github.com/tinted-theming/tinted-terminal)
[colors.primary]
background = '#262427'
foreground = '#fcfcfc'

[colors.cursor]
text = '#262427'
cursor = '#fcfcfc'

[colors.normal]
black = '#262427'
red = '#ff7272'
green = '#bcdf59'
yellow = '#ffca58'
blue = '#49cae4'
magenta = '#a093e2'
cyan = '#aee8f4'
white = '#fcfcfc'

[colors.bright]
black = '#676567'
red = '#ff8787'
green = '#c6e472'
yellow = '#ffd271'
blue = '#64d2e8'
magenta = '#aea3e6'
cyan = '#baebf6'
white = '#fcfcfc'

# Extra base24 slots at 16-21, matching `~/.zsh/50-colors.zsh`.
[[colors.indexed_colors]]
index = 16
color = '#fc9d6f'

[[colors.indexed_colors]]
index = 17
color = '#ff8787'

[[colors.indexed_colors]]
index = 18
color = '#3b393c'

[[colors.indexed_colors]]
index = 19
color = '#514f52'

[[colors.indexed_colors]]
index = 20
color = '#7c7b7d'

[[colors.indexed_colors]]
index = 21
color = '#eae9eb'

[keyboard]
bindings = [
  { key = "Enter", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Enter", mods = "Alt", chars = "\u001b[13;3u" },
  { key = "Enter", mods = "Control", chars = "\u001b[13;5u" },
  { key = "Enter", mods = "Command", chars = "\u001b[13;9u" },
]

